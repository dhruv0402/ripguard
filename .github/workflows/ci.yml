name: RipGuard CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================
  # 1. Backend Linting & Test Verification
  # ==============================================================
  backend-ci:
    name: Backend Pytest & ML Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r ml/requirements.txt
          pip install torch torchvision segmentation-models-pytorch albumentations onnx onnxruntime onnxscript pytest-asyncio pytest

      - name: Run Backend Tests
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite+aiosqlite:///backend/ripguard.db"
        run: |
          pytest backend/tests/ -v

      - name: Run ML Pipeline Tests
        env:
          PYTHONPATH: .
        run: |
          pytest ml/tests/ -v

  # ==============================================================
  # 2. Frontend Linting, Unit Tests & Production Build
  # ==============================================================
  frontend-ci:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run Production Build (TypeScript check & Vite bundling)
        run: npm run build

  # ==============================================================
  # 3. Containerization / Docker Build Check (CD Readiness)
  # ==============================================================
  docker-validation:
    name: Docker Build & Image Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ripguard-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: ripguard-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
