version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ripguard
    ports:
      - "5432:5432"
    volumes:
      - ripguard_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ripguard
      JWT_SECRET_KEY: dev-secret-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/storage:/app/storage
      - ./ml:/ml

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000


volumes:
  ripguard_pgdata:
